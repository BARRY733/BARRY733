[project]
name = "oeil-bleu"
version = "0.1.0"
description = "Veille satellitaire des crues sur les bassins du Sénégal et du Niger"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
satellite = ["rasterio>=1.3", "numpy", "pyproj>=3.6"]
glofas = ["cdsapi>=0.7", "xarray", "netCDF4"]
agents = ["anthropic>=1.8", "pydantic>=2"]
carte = ["matplotlib>=3.8"]
web = ["flask>=3"]
dev = ["pytest>=8", "oeil-bleu[satellite,glofas,agents,carte,web]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oeil_bleu*"]

[tool.setuptools.package-data]
"oeil_bleu.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
