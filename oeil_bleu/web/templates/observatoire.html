<title>Œil Bleu · Atelier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Œil Bleu · Atelier — identité sombre assumée : un poste d'analyse, pas une vitrine. */
:root{
  color-scheme:dark;
  --fond:#0A0F17; --rail:#0C121C; --panneau:#0F1621; --panneau-2:#131C29; --survol:#18233300;
  --filet:#1C2737; --filet-fort:#2A3A4F; --texte:#DCE4EE; --texte-2:#93A2B5; --texte-3:#627185;
  --accent:#3D8BFD; --accent-fond:#13294A; --accent-texte:#9CC4FF;
  --eau:#4EA1FF; --eau-pale:#1B3556; --seuil:#F5854A;
  --alerte:#FF7A59; --alerte-fond:#3A1A12; --ok:#3DD68C; --ok-fond:#0F2E20;
  --perm:#F2B84B; --perm-fond:#352A0F; --inc:#8391A4; --inc-fond:#1B2431;
  --terre:#152030; --terre-bord:#26364B; --mer:#0A111B; --fleuve:#2F6FB8;
  --ui:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--texte);font:13px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-texte)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* Rail */
.rail{background:var(--rail);border-right:1px solid var(--filet);display:flex;flex-direction:column;gap:18px;padding:16px 12px;position:sticky;top:0;height:100vh}
.marque{display:flex;align-items:center;gap:10px;padding:2px 6px 10px;border-bottom:1px solid var(--filet)}
.marque b{font:700 15px/1 var(--ui);letter-spacing:.14em}
.marque small{display:block;font:500 10px/1.3 var(--mono);color:var(--texte-3);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.espace{border:1px solid var(--filet);border-radius:6px;padding:8px 10px;display:grid;gap:2px}
.espace span{font:500 10px/1.2 var(--mono);color:var(--texte-3);text-transform:uppercase;letter-spacing:.1em}
.espace b{font-weight:600}
.nav{display:grid;gap:2px}
.nav .titre{font:500 10px/1 var(--mono);color:var(--texte-3);text-transform:uppercase;letter-spacing:.12em;padding:6px 8px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:var(--texte-2);cursor:pointer;font-weight:500}
.nav button:hover{background:var(--panneau-2);color:var(--texte)}
.nav button[aria-current="page"]{background:var(--accent-fond);color:var(--accent-texte)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav svg{flex:none}
.nav .compte{margin-left:auto;font:500 11px/1 var(--mono);color:var(--texte-3);background:var(--panneau-2);border:1px solid var(--filet);border-radius:3px;padding:2px 6px}
.rail-pied{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--texte-3);border-top:1px solid var(--filet);padding-top:12px}
.mode{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);color:var(--texte-2)}
.mode::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mode,var(--perm))}
/* Barre haute */
.principal{display:flex;flex-direction:column;min-width:0}
.haut{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--filet);background:var(--rail);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.fil{font-size:12px;color:var(--texte-3);display:flex;gap:6px;align-items:center}
.fil b{color:var(--texte);font-weight:500}
.recherche{flex:1;min-width:180px;max-width:420px;position:relative}
.recherche input{width:100%;background:var(--panneau);border:1px solid var(--filet);border-radius:5px;padding:7px 10px 7px 30px;outline:none}
.recherche input:focus{border-color:var(--accent)}
.recherche svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--texte-3)}
.date{font:500 12px/1 var(--mono);color:var(--texte-2);margin-left:auto;white-space:nowrap}
.contenu{padding:18px 20px 40px;display:grid;gap:14px;align-content:start}
.entete{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.entete .surtitre{font:500 10px/1 var(--mono);color:var(--accent-texte);letter-spacing:.14em;text-transform:uppercase}
.entete h1{margin:6px 0 2px;font:600 22px/1.2 var(--ui);letter-spacing:-.01em}
.entete p{margin:0;color:var(--texte-2);max-width:78ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.bouton{display:inline-flex;align-items:center;gap:7px;border-radius:5px;padding:7px 12px;border:1px solid var(--filet-fort);background:var(--panneau-2);cursor:pointer;font-weight:500;text-decoration:none;color:var(--texte)}
.bouton:hover{border-color:var(--texte-3)}
.bouton.primaire{background:var(--accent);border-color:var(--accent);color:#fff}
.bouton:focus-visible,.onglet:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bouton[disabled]{opacity:.5;cursor:not-allowed}
/* Blocs */
.bandeau{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--filet);border-radius:6px;background:var(--panneau);overflow:hidden}
.stat{padding:12px 14px;display:grid;gap:3px;border-left:1px solid var(--filet)}
.stat:first-child{border-left:0}
.stat span{font:500 10px/1.2 var(--mono);color:var(--texte-3);text-transform:uppercase;letter-spacing:.1em}
.stat b{font:500 22px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.stat small{color:var(--texte-3);font-size:11.5px}
.panneau{background:var(--panneau);border:1px solid var(--filet);border-radius:6px;min-width:0;overflow:hidden}
.panneau > header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--filet);flex-wrap:wrap}
.panneau > header h2{margin:0;font:600 13px/1.3 var(--ui)}
.panneau > header small{color:var(--texte-3);font-size:12px}
.corps{padding:14px}
.duo{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.trio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.etiq{font:500 10px/1.2 var(--mono);color:var(--texte-3);text-transform:uppercase;letter-spacing:.1em}
.etat{display:inline-flex;align-items:center;gap:6px;width:fit-content;font:500 11px/1.2 var(--mono);padding:3px 7px;border-radius:3px;white-space:nowrap;border:1px solid transparent}
.etat::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.etat.alerte{color:var(--alerte);background:var(--alerte-fond);border-color:#5a2616}.etat.surveille{color:var(--ok);background:var(--ok-fond);border-color:#17452f}
.etat.eau_permanente{color:var(--perm);background:var(--perm-fond);border-color:#54421a}.etat.incomplet{color:var(--inc);background:var(--inc-fond);border-color:#2a3647}
.puce{font:500 11px/1 var(--mono);color:var(--texte-2);background:var(--panneau-2);border:1px solid var(--filet);border-radius:3px;padding:3px 6px}
/* Carte */
.carte-zone{position:relative;background:var(--mer)}
.carte{display:block;width:100%;height:520px;cursor:grab;touch-action:none}
.carte.glisse{cursor:grabbing}
.carte .pays{fill:var(--terre);stroke:var(--terre-bord);stroke-width:.5;vector-effect:non-scaling-stroke}
.carte .pays.focus{fill:#1A283C}
.carte .fleuve{fill:none;stroke:var(--fleuve);stroke-width:1.1;vector-effect:non-scaling-stroke;opacity:.9}
.carte .lac{fill:#173457;stroke:var(--fleuve);stroke-width:.5;vector-effect:non-scaling-stroke}
.carte .nom-pays{font:500 9px var(--mono);fill:#5B6B80;letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
.carte .nom-site{font:600 11px var(--ui);fill:var(--texte);paint-order:stroke;stroke:var(--mer);stroke-width:3px;pointer-events:none}
.carte .site{cursor:pointer}
.carte .site:focus{outline:none}
.carte .site:focus-visible .halo{stroke:var(--accent)}
.outils{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.outils button{width:30px;height:30px;border-radius:5px;background:var(--panneau);border:1px solid var(--filet-fort);cursor:pointer;display:grid;place-items:center;color:var(--texte-2)}
.outils button:hover{color:var(--texte)}
.bascule{position:absolute;left:10px;top:10px;display:flex;border:1px solid var(--filet-fort);border-radius:5px;overflow:hidden;background:var(--panneau)}
.bascule button{border:0;background:none;padding:5px 10px;cursor:pointer;color:var(--texte-2);font-weight:500}
.bascule button[aria-pressed="true"]{background:var(--accent-fond);color:var(--accent-texte)}
.echelle{position:absolute;left:10px;bottom:10px;font:500 10px var(--mono);color:var(--texte-3);background:rgba(10,15,23,.8);padding:3px 6px;border-radius:3px}
.legende-carte{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:9px 14px;border-top:1px solid var(--filet);font-size:12px;color:var(--texte-2)}
.legende-carte label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.legende-carte .sep{flex:1}
.pastille{width:8px;height:8px;border-radius:50%;display:inline-block}
/* Inspecteur */
.inspecteur{display:grid;gap:0}
.insp-tete{padding:14px;display:grid;gap:8px;border-bottom:1px solid var(--filet)}
.insp-tete h3{margin:0;font:600 18px/1.25 var(--ui)}
.insp-tete .ligne{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.explication{margin:0;padding:8px 10px;border-radius:4px;background:var(--panneau-2);border-left:2px solid var(--c,var(--texte-3));font-size:12.5px;color:var(--texte)}
.props{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0;border-bottom:1px solid var(--filet)}
.props div{padding:10px 14px;display:grid;gap:3px;border-top:1px solid var(--filet)}
.props div:nth-child(-n+2){border-top:0}
.props div:nth-child(2n){border-left:1px solid var(--filet)}
.props dt{font:500 10px/1.2 var(--mono);color:var(--texte-3);text-transform:uppercase;letter-spacing:.08em}
.props dd{margin:0;font:500 17px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.props dd small{font:11px var(--ui);color:var(--texte-3)}
.sait{list-style:none;margin:0;padding:12px 14px;display:grid;gap:8px;font-size:12.5px}
.sait li{display:grid;grid-template-columns:10px 1fr;gap:9px}
.sait li::before{content:"";width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--p)}
.insp-actions{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--filet);flex-wrap:wrap}
/* Listes et tableaux */
.liste{list-style:none;margin:0;padding:0}
.liste li + li{border-top:1px solid var(--filet)}
.liste button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:10px 14px;cursor:pointer}
.liste button:hover{background:var(--panneau-2)}
.liste button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.liste small{color:var(--texte-3);font-size:12px}
.tableau{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--filet);white-space:nowrap}
th{font:500 10px/1.2 var(--mono);color:var(--texte-3);text-transform:uppercase;letter-spacing:.1em;background:var(--panneau-2);position:sticky;top:0}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--accent)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panneau-2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
.id{font:500 11px var(--mono);color:var(--texte-3)}
.filtres{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,.champ{background:var(--panneau);border:1px solid var(--filet-fort);border-radius:5px;padding:6px 9px}
.vide{padding:28px 14px;color:var(--texte-3);text-align:center}
.vide b{display:block;color:var(--texte-2);font-weight:600;margin-bottom:4px}
/* Onglets */
.onglets{display:flex;gap:2px;border-bottom:1px solid var(--filet);padding:0 14px;overflow-x:auto}
.onglet{all:unset;padding:10px 12px;cursor:pointer;color:var(--texte-2);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.onglet[aria-selected="true"]{color:var(--texte);border-bottom-color:var(--accent)}
/* Graphiques */
.graphe svg{display:block;width:100%;height:auto}
.graphe text{font:10.5px var(--mono);fill:var(--texte-3)}
.legende{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--texte-2);padding:0 14px 10px}
.legende i{display:inline-block;width:14px;border-top:2px solid;vertical-align:middle;margin-right:5px}
.note{font-size:11.5px;color:var(--texte-3);padding:0 14px 12px;margin:0}
/* Relations */
.graphe-rel{display:block;width:100%;height:auto;min-height:420px}
.graphe-rel .lien{fill:none;stroke:var(--filet-fort);stroke-width:1.2}
.graphe-rel .noeud rect{fill:var(--panneau-2);stroke:var(--filet-fort)}
.graphe-rel .noeud.centre rect{fill:var(--accent-fond);stroke:var(--accent)}
.graphe-rel .noeud text{font:500 11px var(--ui);fill:var(--texte)}
.graphe-rel .noeud .t{font:500 9px var(--mono);fill:var(--texte-3);letter-spacing:.08em;text-transform:uppercase}
.graphe-rel .colonne{font:500 10px var(--mono);fill:var(--texte-3);letter-spacing:.12em;text-transform:uppercase}
/* Scénarios */
.curseurs{display:grid;gap:16px}
.curseur{display:grid;gap:6px}
.curseur label{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.curseur output{font:500 13px var(--mono);color:var(--accent-texte)}
.curseur input{width:100%;accent-color:var(--accent)}
.curseur small{color:var(--texte-3)}
/* Sources */
.sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.source{background:var(--panneau);border:1px solid var(--filet);border-radius:6px;padding:14px;display:grid;gap:10px;align-content:start}
.source h3{margin:0;font:600 13.5px/1.35 var(--ui)}
.source dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.source dt{color:var(--texte-3)}
.source dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Journal */
.journal{list-style:none;margin:0;padding:0}
.journal li{display:grid;grid-template-columns:130px 96px 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--filet);align-items:start}
.journal li:first-child{border-top:0}
.journal time{font:500 11.5px var(--mono);color:var(--texte-3)}
.journal .detail{color:var(--texte-3);font-size:12px;display:block}
/* Dialogue */
dialog{background:var(--panneau);color:var(--texte);border:1px solid var(--filet-fort);border-radius:8px;padding:0;width:min(640px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(3,6,10,.7)}
dialog header{padding:14px 16px;border-bottom:1px solid var(--filet);display:flex;justify-content:space-between;align-items:center}
dialog header h2{margin:0;font:600 15px var(--ui)}
dialog .corps{display:grid;gap:10px}
dialog textarea{width:100%;min-height:150px;background:var(--fond);border:1px solid var(--filet-fort);border-radius:5px;padding:9px;font:12px/1.5 var(--mono)}
dialog footer{padding:12px 16px;border-top:1px solid var(--filet);display:flex;justify-content:flex-end;gap:8px}
.message{padding:9px 11px;border-radius:5px;font-size:12.5px}
.message.ok{background:var(--ok-fond);color:var(--ok)}.message.erreur{background:var(--alerte-fond);color:var(--alerte)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panneau-2);border:1px solid var(--filet-fort);border-radius:6px;padding:10px 14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:20}
.toast.visible{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1100px){.duo{grid-template-columns:1fr}.bandeau{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(4){border-left:0}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:column;padding:12px 16px;gap:10px;min-width:0}
  .date{white-space:normal;margin-left:0;flex-basis:100%}
  .recherche{max-width:none}
  .stat:last-child{grid-column:1/-1;border-top:1px solid var(--filet)}
  .espace,.rail-pied{display:none}
  .nav{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:4px}
  .nav .titre{display:none}
  .haut{position:static;padding:10px 16px}
  .contenu{padding:14px 16px 32px}
  .trio{grid-template-columns:1fr}
  .bandeau{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-top:1px solid var(--filet)}.stat:nth-child(odd){border-left:0}.stat:nth-child(-n+2){border-top:0}.stat:nth-child(4){border-left:1px solid var(--filet)}
  .carte{height:380px}
  .journal li{grid-template-columns:1fr}
}
</style>

<div class="app" id="app">
  <aside class="rail">
    <div class="marque"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 15c3.6-5.6 8-8.4 13-8.4S24.4 9.4 28 15c-3.6 5.6-8 8.4-13 8.4S5.6 20.6 2 15z" fill="none" stroke="#3D8BFD" stroke-width="1.8"/><circle cx="15" cy="15" r="5" fill="#3D8BFD"/><circle cx="16.6" cy="13.4" r="1.4" fill="#0A0F17"/></svg><div><b>ŒIL BLEU</b><small>Atelier d'analyse</small></div></div>
    <div class="espace"><span>Espace</span><b>Pilote Sahel</b><small class="id">Sénégal · Niger · Afrique</small></div>

      <span class="titre">Espace de travail</span>

    <div class="rail-pied"><span class="mode" id="mode"></span><span id="pied-rail"></span></div>

  <div class="principal">
    <div class="haut">
      <div class="fil"><span>Atelier</span><span>/</span><b id="fil"></b></div>
      <div class="recherche"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.6"/></svg><input id="recherche" type="search" placeholder="Rechercher un site, un pays, une source…" aria-label="Rechercher"></div>
      <span class="date" id="date"></span>
    </div>
    <main class="contenu" id="vue" tabindex="-1"></main>
  </div>
</div>
<dialog id="dialogue"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
var D=/*DONNEES*/null, EN_LIGNE=/*EN_LIGNE*/false;

function vScenarios(){
  var S=etat.scen||(etat.scen={freq:D.seuils.freq_rare,perm:D.seuils.eau_permanente,vv:D.seuils.vv_db,baisse:D.seuils.baisse_vv_db});
  function evaluer(s){
    if(s.frequence==null)return ["incomplet","pas de référence"];
    var fin=Date.parse(String(D.jour).slice(0,10)),deb=fin-D.seuils.fenetre_jours*864e5;
    var radarEau=s.radar_reference!=null&&s.radar.some(function(r){var t=Date.parse(r.date);return t>=deb&&t<=fin&&r.db<=S.vv&&s.radar_reference-r.db>=S.baisse;});

    var eau=(der&&der.eau===1)||radarEau;
    if(eau&&s.frequence<S.freq)return ["alerte","eau vue sur un point en eau "+pct(s.frequence)+" du temps (< "+pct(S.freq)+")"];
    if(s.frequence>=S.perm)return ["eau_permanente","eau "+pct(s.frequence)+" du temps (≥ "+pct(S.perm)+")"];

  $("vue").innerHTML=entete("scenarios",'<button class="bouton" id="reinit">Revenir aux réglages actuels</button>')
   +'<div class="duo"><section class="panneau"><header><h2>Résultat sur les données réelles au '+dFr(D.jour)+'</h2><small>Simulation locale</small></header><div id="resultat"></div></section>'

  function maj(){curs.forEach(function(c){$("o-"+c[0]).textContent=c[5](S[c[0]]);});

     +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="etat '+(s.licence_verifiee?"surveille":"eau_permanente")+'">'+(s.licence_verifiee?"Licence confirmée":"Licence à confirmer")+'</span>'+(s.url?'<a href="'+h(s.url)+'" target="_blank" rel="noopener noreferrer">Page officielle ↗</a>':'')+'</div>'
     +(s.erreur?'<p class="note" style="padding:0">Dernière erreur : '+h(String(s.erreur).slice(0,140))+'</p>':'')+'</article>';}).join("")+'</div>';
}

// ---------- Journal ----------
function journalListe(l){return l.length?'<ul class="journal">'+l.map(function(j){return '<li><time>'+dFr(j.quand)+' '+hFr(j.quand)+'</time><span class="puce" style="width:fit-content">'+h(j.nature)+'</span><span>'+h(j.titre)+(j.detail?'<span class="detail">'+h(j.detail)+'</span>':'')+'</span></li>';}).join("")+'</ul>':'<div class="vide"><b>Aucun événement</b></div>';}
function vJournal(){
  var natures=Array.from(new Set(D.journal.map(function(j){return j.nature;}))), f=etat.nature||"";
  $("vue").innerHTML=entete("journal")+'<section class="panneau"><header><div class="filtres"><h2>Événements</h2><span class="puce">'+D.journal.length+'</span></div><select id="f-nature" aria-label="Nature"><option value="">Toutes les natures</option>'+natures.map(function(n){return '<option'+(f===n?" selected":"")+'>'+h(n)+'</option>';}).join("")+'</select></header>'+journalListe(D.journal.filter(function(j){return !f||j.nature===f;}))+'<p class="note" style="padding-top:10px">Registre tiré de la base : les décisions du directeur et les bulletins envoyés ne peuvent pas y être modifiés ni effacés.</p></section>';
  $("f-nature").addEventListener("change",function(e){etat.nature=e.target.value;vJournal();});
}

// ---------- Import / export ----------
function csvSites(){var l=[["nom","type","latitude","longitude","pays","etat","eau_habituelle","reference","gsw","derniere_eau","radar_dernier_db"]];sites.forEach(function(s){var d=derniereEau(s),r=s.radar.slice(-1)[0];l.push([s.nom,s.type,s.lat.toFixed(5),s.lon.toFixed(5),s.pays,ETATS[s.etat],s.frequence==null?"":s.frequence.toFixed(3),libRef(s.reference),s.gsw==null?"":s.gsw.toFixed(3),d?d.date:"",r?r.db:""]);});return l.map(function(r){return r.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}).join("\n");}
function dialogueImport(){
  var dl=$("dialogue");
  dl.innerHTML='<header><h2>Importer des sites</h2><button class="bouton" data-fermer aria-label="Fermer">✕</button></header><div class="corps"><p style="margin:0;color:var(--texte-2)">Colonnes <code>nom,type,latitude,longitude</code> ; <code>zone_code</code> et <code>notes</code> facultatifs. Le pays est trouvé d\'après les coordonnées. Le fichier entier est refusé à la moindre ligne invalide.</p>'
   +'<label class="etiq" for="fichier">Fichier CSV</label><input id="fichier" type="file" accept=".csv,text/csv"><label class="etiq" for="texte-csv">Ou coller le contenu</label><textarea id="texte-csv" spellcheck="false">nom,type,latitude,longitude,notes\n</textarea><div id="retour"></div>'
   +(EN_LIGNE?'':'<div class="message erreur">Cette page est un instantané en lecture seule : l\'import se fait depuis l\'application Œil Bleu, connectée à la base.</div>')+'</div>'
   +'<footer><button class="bouton" data-fermer>Annuler</button><button class="bouton primaire" id="envoyer-import"'+(EN_LIGNE?'':' disabled')+'>Importer</button></footer>';
  dl.showModal();
  $("fichier").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$("texte-csv").value=r.result;};r.readAsText(f);});
  var b=$("envoyer-import");if(b)b.addEventListener("click",function(){
    b.disabled=true;var jeton=(document.querySelector('meta[name="jeton"]')||{}).content||"";
    fetch("observatoire/import",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"jeton="+encodeURIComponent(jeton)+"&csv="+encodeURIComponent($("texte-csv").value),credentials:"same-origin"})
     .then(function(r){return r.json().then(function(j){return [r.ok,j];});})
     .then(function(x){$("retour").innerHTML='<div class="message '+(x[0]?"ok":"erreur")+'">'+h(x[1].message).replace(/\n/g,"<br>")+'</div>';if(x[0])setTimeout(function(){location.reload();},1200);else b.disabled=false;})
     .catch(function(){$("retour").innerHTML='<div class="message erreur">Le serveur ne répond pas. Réessayez dans un instant.</div>';b.disabled=false;});
  });
}
function exporter(){
  if(EN_LIGNE){location.href="observatoire/sites.csv";return;}
  var t=csvSites();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Tableau des sites copié (CSV) : collez-le dans un tableur.");},function(){montrerCsv(t);});}else montrerCsv(t);
}
function montrerCsv(t){var dl=$("dialogue");dl.innerHTML='<header><h2>Exporter les sites</h2><button class="bouton" data-fermer aria-label="Fermer">✕</button></header><div class="corps"><p style="margin:0;color:var(--texte-2)">Sélectionnez puis copiez ce contenu dans un tableur.</p><textarea readonly id="csv-sortie">'+h(t)+'</textarea></div><footer><button class="bouton" data-fermer>Fermer</button></footer>';dl.showModal();var z=$("csv-sortie");z.focus();z.select();}

// ---------- Délégation ----------
document.addEventListener("click",function(e){
  var t=e.target;
  var b=t.closest("[data-site]");if(b&&b.tagName==="BUTTON"){choisir(Number(b.dataset.site));return;}
  b=t.closest("[data-fiche]");if(b){aller("fiche",{site:Number(b.dataset.fiche),onglet:"apercu"});return;}
  b=t.closest("[data-relations]");if(b){aller("relations",{site:Number(b.dataset.relations)});return;}
  b=t.closest("[data-vue-lien]");if(b){aller(b.dataset.vueLien);return;}
  b=t.closest("[data-onglet]");if(b){etat.onglet=b.dataset.onglet;vFiche();return;}
  b=t.closest("[data-tri]");if(b){var c=b.dataset.tri;etat.tri=[c,etat.tri[0]===c?-etat.tri[1]:1];vObjets();return;}
  b=t.closest("[data-action]");if(b){if(b.dataset.action==="importer")dialogueImport();else exporter();return;}
  if(t.closest("[data-fermer]")){$("dialogue").close();return;}
});
document.addEventListener("change",function(e){var c=e.target.closest("[data-couche]");if(c){etat.couches[c.dataset.couche]=c.checked;var svg=$("carte");vider(svg);carte();}});
document.addEventListener("keydown",function(e){var r=e.target.closest("tr[data-fiche]");if(r&&e.key==="Enter")aller("fiche",{site:Number(r.dataset.fiche)});if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();$("recherche").focus();}});
rendre();
})();
</script>
